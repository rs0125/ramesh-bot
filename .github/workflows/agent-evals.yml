name: Agent conversation evals

on:
  workflow_dispatch:
    inputs:
      cases:
        description: Comma-separated case IDs for this run
        default: 'changed-history,source-label-crm-name,source-label-knowledge-title'
        required: true
        type: string
      trials:
        description: Independent trials per scenario (1 to 5)
        default: '1'
        required: true
        type: choice
        options: ['1', '2', '3', '4', '5']
      max_trials:
        description: Maximum total scenario executions approved for this run
        default: '3'
        required: true
        type: string
      max_usd:
        description: Approved total USD allowance for agent, grader and retries; required
        required: true
        type: string
      model:
        description: Agent and grader model
        default: 'gpt-6-luna'
        type: choice
        options: ['gpt-6-luna', 'gpt-6.1-sol']
      sol_approval:
        description: User approval reference for this Sol run; leave empty for Luna
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: agent-evals-main
  cancel-in-progress: false

jobs:
  conversations:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Configure this environment's secret and optional required reviewers in GitHub.
    environment: agent-evals
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run prisma:generate
      - run: npm run typecheck && npm run build
      - name: Run the explicitly selected conversations with fictional tools
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_MODEL: ${{ inputs.model }}
          AGENT_TOOL_REASONING_EFFORT: medium
          EVAL_CASES: ${{ inputs.cases }}
          EVAL_TRIALS: ${{ inputs.trials }}
          EVAL_MAX_TRIALS: ${{ inputs.max_trials }}
          EVAL_MAX_USD: ${{ inputs.max_usd }}
          EVAL_USAGE_PRICES_JSON: ${{ vars.EVAL_USAGE_PRICES_JSON }}
          SOL_APPROVAL_REFERENCE: ${{ inputs.sol_approval }}
        run: npm run eval:ci -- --case "$EVAL_CASES" --trials "$EVAL_TRIALS" --max-trials "$EVAL_MAX_TRIALS" --max-usd "$EVAL_MAX_USD" --model "$EVAL_MODEL" --judge-model "$EVAL_MODEL" --sol-approval "$SOL_APPROVAL_REFERENCE"
      - name: Publish quality summary
        if: always()
        run: |
          for summary in .local/ci-evals/*/summary.md; do
            if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Preserve every trial and JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramesh-agent-evals-${{ github.run_id }}
          path: |
            .local/ci-evals/
            .local/judge-calibration/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
