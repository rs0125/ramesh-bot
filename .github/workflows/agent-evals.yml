name: Agent conversation evals

on:
  workflow_dispatch:
    inputs:
      trials:
        description: Independent trials per scenario (1 to 5)
        default: '2'
        required: true
        type: choice
        options: ['1', '2', '3', '4', '5']
  schedule:
    - cron: '30 1 * * 1'

permissions:
  contents: read

concurrency:
  group: agent-evals-main
  cancel-in-progress: false

jobs:
  conversations:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.AGENT_EVALS_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Configure this environment's secret and optional required reviewers in GitHub.
    environment: agent-evals
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run prisma:generate
      - run: npm run typecheck && npm run build
      - name: Calibrate the independent grader on known positive and negative outcomes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run eval:judge
      - name: Run every conversation with the real model and fictional tools
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6.1-sol
          AGENT_TOOL_REASONING_EFFORT: medium
          EVAL_TRIALS: ${{ inputs.trials || '2' }}
        run: npm run eval:ci -- --trials "$EVAL_TRIALS"
      - name: Publish quality summary
        if: always()
        run: |
          for summary in .local/ci-evals/*/summary.md; do
            if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Preserve every trial and JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramesh-agent-evals-${{ github.run_id }}
          path: |
            .local/ci-evals/
            .local/judge-calibration/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
