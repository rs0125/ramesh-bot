name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Worker checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ramesh-test-only
          POSTGRES_DB: ramesh_queue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: file:./ci.db
      TEST_MESSAGE_DATABASE_URL: postgresql://postgres:ramesh-test-only@127.0.0.1:5432/ramesh_queue_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run prisma:generate
      - name: Install the native audio decoder used by media tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      # Tests use fake sessions and temporary databases; CI needs no WhatsApp credentials.
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Validate service and release entry point
        run: |
          sh -n deploy/ec2/wareongo-bot-deploy
          bash -n deploy/ec2/bootstrap.sh
          # setup-node installs into the runner tool cache; production uses /usr/bin/node.
          if [ ! -x /usr/bin/node ]; then sudo ln -s "$(command -v node)" /usr/bin/node; fi
          systemd-analyze verify deploy/ec2/wareongo-bot.service
